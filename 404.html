<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <title>Page Not Found | Pertis Infra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Pertis Infra home">
        <span class="logo-text">Pertis Infra</span>
      </a>
    </div>
  </header>
  <main class="not-found">
    <section class="not-found__content" aria-labelledby="not-found-title">
      <p class="not-found__code">ERROR 404</p>
      <h1 class="not-found__title" id="not-found-title">This page is not on the plan.</h1>
      <p class="not-found__copy">The address may be incorrect or the page may have moved.</p>
      <a class="btn btn-primary" href="/">Return home</a>
    </section>
  </main>
</body>
</html>
